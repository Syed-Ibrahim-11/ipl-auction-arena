<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IPL Auction Arena</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(620px 340px at 50% 26%, rgba(255,122,26,.16), transparent 66%),
      repeating-linear-gradient(90deg, transparent 0 74px, rgba(255,255,255,.028) 74px 75px),
      #070b12;
    color: #eef2f7;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { width: 100%; max-width: 360px; text-align: center; }
  .mark {
    width: 84px; height: 84px; border-radius: 22px;
    box-shadow: 0 18px 44px rgba(0,0,0,.55);
  }
  .kicker {
    margin: 22px 0 0;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .42em;
    text-transform: uppercase;
    color: #8a97a8;
  }
  h1 {
    margin: 6px 0 0;
    font-size: 34px;
    font-weight: 800;
    letter-spacing: .06em;
    text-transform: uppercase;
  }
  .msg { margin: 26px 0 0; font-size: 16px; font-weight: 600; }
  .sub {
    margin: 10px 0 0;
    font-size: 14px;
    line-height: 1.55;
    color: #9aa8ba;
  }
  button {
    margin-top: 26px;
    width: 100%;
    padding: 15px 20px;
    border: 0;
    border-radius: 14px;
    background: #ff7a1a;
    color: #120c06;
    font: inherit;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: .08em;
    text-transform: uppercase;
    cursor: pointer;
  }
  button:active { transform: translateY(1px); filter: brightness(.94); }
  .hint { margin: 14px 0 0; font-size: 12px; color: #66748a; }
</style>
</head>
<body>
  <div class="wrap">
    <img class="mark" src="logo.png" alt="">
    <p class="kicker">IPL Auction</p>
    <h1>Arena</h1>
    <p class="msg">Can&rsquo;t reach the auction room.</p>
    <p class="sub">The host server is offline right now. Check your connection, then try again.</p>
    <button id="retry" type="button">Try again</button>
    <p class="hint" id="hint"></p>
  </div>
  <script>
    var hint = document.getElementById('hint');
    var wait = 20;
    function attempt() {
      if (window.Arena && window.Arena.retry) {
        window.Arena.retry();
      }
    }
    document.getElementById('retry').addEventListener('click', attempt);
    setInterval(function () {
      wait -= 1;
      if (wait <= 0) { attempt(); wait = 20; }
      hint.textContent = 'Retrying automatically in ' + wait + 's';
    }, 1000);
    hint.textContent = 'Retrying automatically in ' + wait + 's';
  </script>
</body>
</html>
